<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Update - LalitMods</title>
<style>
  :root {
    --bg: #0b0b0f;
    --surface: #17171f;
    --surface2: #22222c;
    --text: #f5f1e6;
    --muted: #9a958a;
    --accent: #d4af37;
    --accent2: #f5d76e;
    --grad: linear-gradient(135deg, #f5d76e, #d4af37, #a8841c);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  }
  header { padding: 16px 0 12px; display: flex; align-items: center; justify-content: space-between; }
  .title {
    font-size: 22px; font-weight: 800; background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .back {
    color: var(--accent); text-decoration: none; font-weight: 700;
    border: 1px solid var(--accent); padding: 8px 14px; border-radius: 12px;
  }
  .box {
    background: linear-gradient(135deg, rgba(212,175,55,.15), rgba(212,175,55,.04));
    border: 1.5px solid var(--accent); border-radius: 16px;
    padding: 16px; margin-bottom: 14px; box-shadow: 0 0 18px rgba(212,175,55,.18);
  }
  .date { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  .ann-title { font-size: 17px; font-weight: 700; color: var(--accent2); margin: 6px 0; }
  .ann-text { font-size: 14px; line-height: 1.5; color: var(--text); white-space: pre-line; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<header>
  <div class="title">📢 Updates</div>
  <a class="back" href="../">← Back</a>
</header>
<div id="list"></div>
<script>
  async function load() {
    const list = document.getElementById("list");
    try {
      const res = await fetch("announcements.json?v=" + Date.now(), { cache: "no-store" });
      const items = await res.json();
      if (!items.length) {
        list.innerHTML = '<div class="empty">Abhi koi update nahi hai.</div>';
        return;
      }
      list.innerHTML = items.map(a => `
        <div class="box">
          <div class="date">${a.date || ""}</div>
          <div class="ann-title">${a.title || ""}</div>
          <div class="ann-text">${a.text || ""}</div>
        </div>`).join("");
    } catch (e) {
      list.innerHTML = '<div class="empty">Update load nahi ho paya.</div>';
    }
  }
  load();
</script>
</body>
</html>
