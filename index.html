<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8dfc9">
<title>LalitMods</title>
<style>
  :root {
    --bg: #e8dfc9; --card: #ffffff; --soft: #f7f2e4; --line: #e2d6b8;
    --text: #1d1a14; --muted: #7a705c; --gold: #9a7400;
    --gold-grad: linear-gradient(135deg, #c9a227, #8a6a00);
  }
  body[data-theme="dark"] {
    --bg: #0f0e0b; --card: #1b1913; --soft: #221f16; --line: #3a3322;
    --text: #f5efe0; --muted: #a79d86; --gold: #e0b84a;
    --gold-grad: linear-gradient(135deg, #e0b84a, #a8841c);
  }
  body[data-theme="emerald"] {
    --bg: #0c1f1a; --card: #133029; --soft: #1a3d34; --line: #24574a;
    --text: #e9f7f1; --muted: #8fbfae; --gold: #5fe0b0;
    --gold-grad: linear-gradient(135deg, #7ff0c4, #2fb887);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: "Segoe UI", Roboto, system-ui, sans-serif; background: var(--bg); color: var(--text);
    transition: background .4s, color .4s; padding-bottom: 80px;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 12px; }

  /* Splash */
  #splash {
    position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, #2a2414, #0b0b0f 70%);
    transition: opacity .6s, visibility .6s; color: #f5efe0;
  }
  #splash.hide { opacity: 0; visibility: hidden; }
  .logo { font-size: 44px; font-weight: 800; letter-spacing: 2px; background: linear-gradient(135deg,#f5d76e,#d4af37,#a8841c); -webkit-background-clip: text; background-clip: text; color: transparent; animation: pop .9s ease both; }
  .team { margin-top: 10px; font-size: 13px; letter-spacing: 6px; color: #d4af37; text-transform: uppercase; }
  .loader { margin-top: 44px; width: 180px; height: 3px; border-radius: 4px; background: #2a2a33; overflow: hidden; }
  .loader span { display: block; height: 100%; width: 40%; background: linear-gradient(135deg,#f5d76e,#d4af37); animation: slide 1.4s ease-in-out infinite; }
  .loading-text { margin-top: 14px; font-size: 12px; color: #9a958a; letter-spacing: 1px; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(300%); } }

  #main { display: none; }
  #main.show { display: block; animation: fade .5s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* Header */
  .hero { background: var(--card); border: 1.5px solid var(--gold); border-radius: 18px; padding: 14px; }
  .brand-row { display: flex; align-items: center; gap: 12px; }
  .brand-logo {
    width: 52px; height: 52px; border-radius: 14px; background: var(--gold-grad); color: #111;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; flex: 0 0 52px;
  }
  .brand-name { font-size: 20px; font-weight: 800; color: var(--gold); }
  .brand-tag { font-size: 10px; letter-spacing: 3px; color: var(--muted); margin-top: 2px; }
  .brand-actions { margin-left: auto; display: flex; gap: 8px; }
  .round {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--gold);
    background: var(--soft); color: var(--gold); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .hero-btns { display: grid; grid-template-columns: 1.1fr 1fr; gap: 10px; margin-top: 14px; }
  .btn-tg { background: var(--gold-grad); color: #111; border-radius: 12px; padding: 12px; font-weight: 700; font-size: 14px; text-decoration: none; text-align: center; }
  .btn-search { background: var(--soft); color: var(--gold); border: 1px solid var(--gold); border-radius: 12px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .search { margin-top: 12px; display: none; }
  .search.open { display: block; }
  .search input {
    width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); padding: 0 14px; font-size: 15px; outline: none;
  }
  .search input:focus { border-color: var(--gold); }

  .section-title { font-size: 16px; font-weight: 800; color: var(--gold); margin: 18px 4px 10px; }

  /* Promo */
  .promo { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-top: 14px; }
  .promo ul { list-style: none; display: grid; gap: 6px; }
  .promo li { font-size: 14px; font-weight: 700; color: var(--text); }

  /* App cards */
  .list { display: grid; gap: 12px; }
  .app-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px;
    display: flex; gap: 12px; align-items: center; cursor: pointer; transition: transform .15s;
  }
  .app-card:active { transform: scale(.98); }
  .app-icon {
    width: 62px; height: 62px; border-radius: 16px; background: var(--gold-grad); color: #111;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; flex: 0 0 62px;
  }
  .app-info { flex: 1; min-width: 0; }
  .app-name { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-cat { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pills { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .pill { font-size: 11px; padding: 3px 8px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); background: var(--soft); }
  .pill.gold { color: var(--gold); border-color: var(--gold); }
  .open-arrow { color: var(--gold); font-size: 22px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; display: none; }
  .footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0 10px; }

  /* Bottom nav (3 items) */
  .bottom-nav {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; z-index: 50;
    background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr);
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .nav-item { text-align: center; font-size: 12px; text-decoration: none; cursor: pointer; background: none; border: none; color: var(--muted); }
  .nav-item .ico { font-size: 20px; display: block; margin-bottom: 2px; }
  .nav-item.active { color: var(--gold); font-weight: 700; }

  /* Detail page */
  #detail {
    position: fixed; inset: 0; z-index: 200; background: var(--bg); overflow-y: auto;
    display: none; padding-bottom: 40px;
  }
  #detail.open { display: block; animation: fade .25s ease; }
  .detail-wrap { max-width: 480px; margin: 0 auto; padding: 12px; }
  .back { background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 6px 0; }
  .detail-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; gap: 14px; align-items: center; margin-top: 6px; }
  .detail-icon { width: 80px; height: 80px; border-radius: 18px; background: var(--gold-grad); color: #111; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; flex: 0 0 80px; }
  .detail-title { font-size: 19px; font-weight: 800; }
  .detail-cat { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .box-title { font-size: 15px; font-weight: 800; color: var(--gold); margin-bottom: 10px; }
  .box-text { font-size: 14px; line-height: 1.6; color: var(--text); white-space: pre-line; }
  .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-row span { color: var(--muted); }

  /* Carousel */
  .car { position: relative; background: #000; border-radius: 16px; overflow: hidden; height: 440px; touch-action: pan-y; }
  .car-track { display: flex; height: 100%; transition: transform .35s ease; }
  .slide { flex: 0 0 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .slide img { max-height: 100%; max-width: 100%; object-fit: contain; display: block; }
  .car-btn {
    position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.55); color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .car-prev { left: 8px; }
  .car-next { right: 8px; }
  .car-dots { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--line); border: none; cursor: pointer; transition: all .3s; padding: 0; }
  .dot.active { width: 26px; background: var(--gold); }
  .car-hidden { display: none; }

  .dl-btn {
    display: block; width: 100%; margin-top: 16px; background: var(--gold-grad); color: #111; border: none;
    border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 800; text-align: center; text-decoration: none;
  }
</style>
</head>
<body data-theme="cream">

<div id="splash">
  <div class="logo" id="appName">LALIT MODS</div>
  <div class="team">Lalit Creative</div>
  <div class="loader"><span></span></div>
  <div class="loading-text">Loading...</div>
</div>

<div id="main">
  <div class="wrap">
    <div class="hero">
      <div class="brand-row">
        <div class="brand-logo">LM</div>
        <div>
          <div class="brand-name" id="brandName">LalitMods</div>
          <div class="brand-tag" id="brandTag">LALIT CREATIVE</div>
        </div>
        <div class="brand-actions">
          <button class="round" id="themeBtn" title="Theme badlo" aria-label="Change theme">☀</button>
        </div>
      </div>
      <div class="hero-btns">
        <a class="btn-tg" href="https://t.me/+kFJy0orjkYdjZjM1" target="_blank" rel="noopener">✈ Join Telegram</a>
        <button class="btn-search" id="searchToggle">🔍 Search Apps</button>
      </div>
      <div class="search" id="searchBox">
        <input id="searchInput" type="search" placeholder="App ka naam likho..." autocomplete="off">
      </div>
    </div>

    <div class="promo">
      <ul>
        <li>✅ 100% Working Mod</li>
        <li>🔄 Daily Update</li>
        <li>🛟 24/7 Support</li>
      </ul>
    </div>

    <div class="section-title">Apps</div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty">Koi app nahi mila.</div>

    <div class="footer">© LalitMods · Lalit Creative</div>
  </div>
</div>

<!-- Detail page -->
<div id="detail">
  <div class="detail-wrap" id="detailContent"></div>
</div>

<!-- Bottom navigation -->
<nav class="bottom-nav">
  <button class="nav-item active" id="navHome"><span class="ico">⌂</span>Home</button>
  <a class="nav-item" href="update/"><span class="ico">📢</span>Updates</a>
  <a class="nav-item" href="https://t.me/+kFJy0orjkYdjZjM1" target="_blank" rel="noopener"><span class="ico">✎</span>Request</a>
</nav>

<script>
  let APPS = [];
  let TG = "https://t.me/+kFJy0orjkYdjZjM1";
  let carIdx = 0;
  let carCount = 0;

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const detailEl = document.getElementById("detail");
  const detailContent = document.getElementById("detailContent");

  // ===== Themes: Cream -> Dark -> Emerald =====
  const THEMES = [
    { id: "cream",   icon: "☀", meta: "#e8dfc9" },
    { id: "dark",    icon: "☾", meta: "#0f0e0b" },
    { id: "emerald", icon: "🌿", meta: "#0c1f1a" }
  ];
  let themeIndex = 0;

  function applyTheme(i) {
    themeIndex = i;
    const t = THEMES[i];
    document.body.setAttribute("data-theme", t.id);
    document.getElementById("themeBtn").textContent = t.icon;
    document.querySelector('meta[name="theme-color"]').content = t.meta;
  }

  document.getElementById("themeBtn").addEventListener("click", () => {
    applyTheme((themeIndex + 1) % THEMES.length);
  });

  // ===== Config =====
  async function loadConfig() {
    try {
      const res = await fetch("config.json?v=" + Date.now(), { cache: "no-store" });
      applyConfig(await res.json());
    } catch (e) {
      applyConfig({ apps: [] });
    }
  }

  function applyConfig(cfg) {
    document.getElementById("appName").textContent = cfg.appName || "LALIT MODS";
    document.getElementById("brandName").textContent = cfg.brandName || "LalitMods";
    document.getElementById("brandTag").textContent = cfg.brandTag || "LALIT CREATIVE";
    document.title = cfg.brandName || "LalitMods";
    if (cfg.telegramUrl) TG = cfg.telegramUrl;

    APPS = (cfg.apps || []).map(a => ({
      name: a.name,
      cat: a.category || "",
      size: Number(a.sizeMB) || 0,
      rating: Number(a.rating) || 0,
      letter: (a.letter || a.name.charAt(0)).toUpperCase(),
      url: a.downloadUrl || TG,
      version: a.version || "1.0",
      updated: a.updated || "-",
      description: a.description || "Is app ki details jaldi add ki jayengi.",
      screenshots: Array.isArray(a.screenshots) ? a.screenshots.slice(0, 5) : []
    }));
    render(APPS);
  }

  function render(items) {
    listEl.innerHTML = items.map(a => `
      <div class="app-card" data-index="${APPS.indexOf(a)}">
        <div class="app-icon">${a.letter}</div>
        <div class="app-info">
          <div class="app-name">${a.name}</div>
          <div class="app-cat">${a.cat}</div>
          <div class="pills">
            <span class="pill gold">⭐ ${a.rating.toFixed(1)}</span>
            <span class="pill">📦 ${a.size.toFixed(1)} MB</span>
            <span class="pill">v${a.version}</span>
          </div>
        </div>
        <div class="open-arrow">›</div>
      </div>`).join("");
    emptyEl.style.display = items.length ? "none" : "block";
  }

  // ===== Carousel =====
  function carouselHtml(list) {
    if (!list.length) return "";
    const many = list.length > 1;
    return `
      <div class="box">
        <div class="box-title">Screenshots</div>
        <div class="car" id="car">
          <div class="car-track" id="carTrack">
            ${list.map(src => `<div class="slide"><img src="${src}" alt="screenshot" loading="lazy" onerror="this.style.display='none'"></div>`).join("")}
          </div>
          <button class="car-btn car-prev ${many ? "" : "car-hidden"}" id="carPrev" aria-label="Previous">‹</button>
          <button class="car-btn car-next ${many ? "" : "car-hidden"}" id="carNext" aria-label="Next">›</button>
        </div>
        <div class="car-dots ${many ? "" : "car-hidden"}" id="carDots">
          ${list.map((_, i) => `<button class="dot" data-i="${i}" aria-label="Photo ${i + 1}"></button>`).join("")}
        </div>
      </div>`;
  }

  function setupCarousel(n) {
    carCount = n;
    carIdx = 0;
    updateCar();
  }

  function goCar(i) {
    if (!carCount) return;
    carIdx = (i + carCount) % carCount;
    updateCar();
  }

  function updateCar() {
    const track = document.getElementById("carTrack");
    if (!track) return;
    track.style.transform = `translateX(-${carIdx * 100}%)`;
    document.querySelectorAll("#carDots .dot").forEach((d, i) => {
      d.classList.toggle("active", i === carIdx);
    });
  }

  detailContent.addEventListener("click", e => {
    if (e.target.closest("#carPrev")) { goCar(carIdx - 1); return; }
    if (e.target.closest("#carNext")) { goCar(carIdx + 1); return; }
    const dot = e.target.closest("#carDots .dot");
    if (dot) goCar(Number(dot.dataset.i));
  });

  let touchX = null;
  detailContent.addEventListener("touchstart", e => {
    if (e.target.closest("#car")) touchX = e.touches[0].clientX;
  }, { passive: true });
  detailContent.addEventListener("touchend", e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 40) goCar(dx < 0 ? carIdx + 1 : carIdx - 1);
  });

  // ===== Detail page =====
  function openDetail(a) {
    detailContent.innerHTML = `
      <button class="back" id="backBtn">‹ Back to Home</button>
      <div class="detail-card">
        <div class="detail-icon">${a.letter}</div>
        <div>
          <div class="detail-title">${a.name}</div>
          <div class="detail-cat">${a.cat}</div>
          <div class="pills" style="margin-top:8px">
            <span class="pill gold">⭐ ${a.rating.toFixed(1)}</span>
            <span class="pill">📦 ${a.size.toFixed(1)} MB</span>
            <span class="pill">v${a.version}</span>
          </div>
        </div>
      </div>

      ${carouselHtml(a.screenshots)}

      <div class="box">
        <div class="box-title">About</div>
        <div class="box-text">${a.description}</div>
      </div>

      <div class="box">
        <div class="box-title">Details</div>
        <div class="info-row"><span>Version</span><b>v${a.version}</b></div>
        <div class="info-row"><span>Size</span><b>${a.size.toFixed(1)} MB</b></div>
        <div class="info-row"><span>Rating</span><b>⭐ ${a.rating.toFixed(1)}</b></div>
        <div class="info-row"><span>Updated</span><b>${a.updated}</b></div>
      </div>

      <a class="dl-btn" href="${a.url}" target="_blank" rel="noopener">⬇ Download v${a.version}</a>
    `;
    detailEl.classList.add("open");
    detailEl.scrollTop = 0;
    setupCarousel(a.screenshots.length);
    document.getElementById("backBtn").addEventListener("click", closeDetail);
  }

  function closeDetail() {
    detailEl.classList.remove("open");
  }

  listEl.addEventListener("click", e => {
    const card = e.target.closest(".app-card");
    if (card) openDetail(APPS[Number(card.dataset.index)]);
  });

  // ===== Search =====
  document.getElementById("searchToggle").addEventListener("click", () => {
    const box = document.getElementById("searchBox");
    box.classList.toggle("open");
    if (box.classList.contains("open")) document.getElementById("searchInput").focus();
  });
  document.getElementById("searchInput").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    render(APPS.filter(a => a.name.toLowerCase().includes(q) || a.cat.toLowerCase().includes(q)));
  });

  // ===== Home =====
  document.getElementById("navHome").addEventListener("click", () => {
    closeDetail();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ===== Splash =====
  function showMain() {
    document.getElementById("splash").classList.add("hide");
    document.getElementById("main").classList.add("show");
  }
  document.getElementById("splash").addEventListener("click", showMain);
  setTimeout(showMain, 3500);
  setTimeout(showMain, 6000);

  applyTheme(0);
  loadConfig();
</script>
</body>
</html>
