<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>LalitMods</title>
<style>
  :root, :root[data-theme="gold"] {
    --bg: #0b0b0f;
    --surface: #17171f;
    --surface2: #22222c;
    --text: #f5f1e6;
    --muted: #9a958a;
    --accent: #d4af37;
    --accent2: #f5d76e;
    --grad: linear-gradient(135deg, #f5d76e, #d4af37, #a8841c);
  }
  :root[data-theme="ocean"] {
    --bg: #071521;
    --surface: #0e2232;
    --surface2: #153048;
    --text: #e6f4ff;
    --muted: #8fb0c8;
    --accent: #3fb8ff;
    --accent2: #8ee0ff;
    --grad: linear-gradient(135deg, #8ee0ff, #3fb8ff, #1c6fb0);
  }
  :root[data-theme="light"] {
    --bg: #f6f3ec;
    --surface: #ffffff;
    --surface2: #efeadf;
    --text: #1d1a14;
    --muted: #6f685b;
    --accent: #b8860b;
    --accent2: #d4af37;
    --grad: linear-gradient(135deg, #d4af37, #b8860b, #8a6508);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .4s, color .4s;
    padding-top: env(safe-area-inset-top, 0px);
  }

  #splash {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #1f1b10, #0b0b0f 70%);
    transition: opacity .6s ease, visibility .6s;
  }
  #splash.hide { opacity: 0; visibility: hidden; }
  .logo {
    font-size: 46px; font-weight: 800; letter-spacing: 2px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text;
    color: transparent; animation: pop .9s ease both;
  }
  .team {
    margin-top: 10px; font-size: 13px; letter-spacing: 6px; color: var(--accent);
    text-transform: uppercase; animation: fade 1.2s .3s ease both;
  }
  .loader {
    margin-top: 44px; width: 180px; height: 3px; border-radius: 4px;
    background: #2a2a33; overflow: hidden;
  }
  .loader span {
    display: block; height: 100%; width: 40%; background: var(--grad);
    border-radius: 4px; animation: slide 1.4s ease-in-out infinite;
  }
  .loading-text { margin-top: 14px; font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(300%); } }

  #main { display: none; min-height: 100%; animation: fade .5s ease; padding-bottom: 90px; }
  #main.show { display: block; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); padding: 16px 16px 12px;
    border-bottom: 1px solid var(--surface2);
  }
  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .brand { font-size: 22px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand small { display: block; font-size: 10px; letter-spacing: 3px; color: var(--accent); -webkit-text-fill-color: var(--accent); }
  .btns { display: flex; gap: 8px; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--accent);
    background: var(--surface); color: var(--accent); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--surface2);
    border-radius: 14px; padding: 0 14px; height: 46px;
  }
  .search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 15px;
  }
  .search input::placeholder { color: var(--muted); }
  .search:focus-within { border-color: var(--accent); }

  .promo {
    margin: 14px 16px 0;
    padding: 14px 16px;
    border-radius: 16px;
    border: 1.5px solid var(--accent);
    background: linear-gradient(135deg, rgba(212,175,55,.15), rgba(212,175,55,.04));
    box-shadow: 0 0 18px rgba(212,175,55,.18);
  }
  .promo ul { list-style: none; display: grid; gap: 8px; }
  .promo li {
    font-size: 15px; font-weight: 700; color: var(--accent2);
    display: flex; align-items: center; gap: 8px;
  }

  .list { padding: 14px 16px 20px; display: grid; gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--surface2);
    border-radius: 18px; padding: 14px; display: flex; gap: 14px; align-items: flex-start;
    transition: transform .2s, border-color .2s; cursor: pointer;
  }
  .card:active { transform: scale(.98); }
  .card:hover { border-color: var(--accent); }
  .icon {
    flex: 0 0 62px; height: 62px; border-radius: 16px;
    background: var(--grad); color: #111; display: flex;
    align-items: center; justify-content: center; font-weight: 800; font-size: 22px;
  }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .meta { display: flex; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .pill { background: var(--surface2); padding: 3px 8px; border-radius: 8px; }
  .rating { color: var(--accent2); font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; display: none; }

  /* ===== Screenshots strip ===== */
  .shots {
    display: flex; gap: 8px; margin-top: 10px;
    overflow-x: auto; scrollbar-width: none;
  }
  .shots::-webkit-scrollbar { display: none; }
  .shots img {
    flex: 0 0 auto; height: 110px; width: auto; max-width: 62vw;
    border-radius: 10px; border: 1px solid var(--surface2);
    background: var(--surface2); object-fit: cover;
  }
  .sec-shots { flex-direction: column; overflow-x: visible; }
  .sec-shots img { width: 100%; height: auto; max-height: 260px; }

  .footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 30px; }

  /* ===== Floating Telegram button ===== */
  .float-tg {
    position: fixed; z-index: 150;
    left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 8px;
    padding: 14px 26px; border-radius: 999px;
    background: var(--grad); color: #111;
    font-weight: 800; font-size: 15px; text-decoration: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.45), 0 0 18px rgba(212,175,55,.35);
    white-space: nowrap;
    animation: floatIn .6s ease both, pulse 2.4s 1s ease-in-out infinite;
  }
  @keyframes floatIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(0,0,0,.45), 0 0 14px rgba(212,175,55,.3); }
    50% { box-shadow: 0 8px 24px rgba(0,0,0,.45), 0 0 26px rgba(212,175,55,.6); }
  }

  /* ===== Detail popup ===== */
  #overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.6); backdrop-filter: blur(3px);
    display: none; align-items: flex-end; justify-content: center;
  }
  #overlay.open { display: flex; animation: fade .25s ease; }
  .sheet {
    width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--surface2);
    border-radius: 22px 22px 0 0; padding: 20px 18px 28px;
    animation: up .3s ease;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet-head { display: flex; gap: 14px; align-items: center; }
  .sheet-head .icon { flex: 0 0 70px; height: 70px; font-size: 26px; }
  .sheet-title { font-size: 19px; font-weight: 800; }
  .sheet-cat { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .close {
    margin-left: auto; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--surface2); background: var(--surface2);
    color: var(--text); font-size: 16px; cursor: pointer; flex: 0 0 36px;
  }
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0;
  }
  .stat {
    background: var(--surface2); border-radius: 12px; padding: 10px 6px; text-align: center;
  }
  .stat b { display: block; font-size: 15px; color: var(--accent2); }
  .stat span { font-size: 11px; color: var(--muted); }
  .sec-title { font-size: 14px; font-weight: 700; color: var(--accent); margin: 16px 0 6px; }
  .sec-text { font-size: 14px; line-height: 1.6; color: var(--text); white-space: pre-line; }
  .dl {
    margin-top: 10px; display: inline-block; text-decoration: none;
    background: var(--grad); color: #111; font-weight: 700; font-size: 13px;
    padding: 9px 18px; border-radius: 12px;
  }
  .sheet .dl { width: 100%; text-align: center; margin-top: 20px; padding: 13px; font-size: 15px; }
</style>
</head>
<body>

<div id="splash">
  <div class="logo" id="appName">LALIT MODS</div>
  <div class="team">Lalit Creative</div>
  <div class="loader"><span></span></div>
  <div class="loading-text">Loading...</div>
</div>

<div id="main">
  <header>
    <div class="top-row">
      <div class="brand"><span id="brandName">LalitMods</span><small id="brandTag">LALIT CREATIVE</small></div>
      <div class="btns">
        <a class="icon-btn" href="update/" title="Updates" aria-label="Updates">📢</a>
        <button id="themeBtn" class="icon-btn" title="Theme badlo" aria-label="Change theme">🎨</button>
      </div>
    </div>
    <div class="search">
      <span>🔍</span>
      <input id="searchInput" type="search" placeholder="App search karo..." autocomplete="off">
    </div>
  </header>

  <div class="promo">
    <ul>
      <li>✅ 100% Working Mod</li>
      <li>🔄 Daily Update</li>
      <li>🛟 24/7 Support</li>
    </ul>
  </div>

  <section class="list" id="list"></section>
  <div class="empty" id="empty">Koi app nahi mila.</div>

  <div class="footer">© LalitMods · Lalit Creative</div>
</div>

<!-- Floating Telegram button -->
<a class="float-tg" id="floatTg" href="https://t.me/+kFJy0orjkYdjZjM1" target="_blank" rel="noopener">
  ✈️ Telegram Join karo
</a>

<!-- Detail popup -->
<div id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
  const THEMES = ["gold", "ocean", "light"];
  let themeIndex = 0;
  let APPS = [];

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const overlay = document.getElementById("overlay");
  const sheet = document.getElementById("sheet");

  async function loadConfig() {
    try {
      const res = await fetch("config.json?v=" + Date.now(), { cache: "no-store" });
      const cfg = await res.json();
      applyConfig(cfg);
    } catch (e) {
      applyConfig({
        appName: "LALIT MODS",
        brandName: "LalitMods",
        brandTag: "LALIT CREATIVE",
        telegramUrl: "https://t.me/+kFJy0orjkYdjZjM1",
        apps: []
      });
    }
  }

  function applyConfig(cfg) {
    document.getElementById("appName").textContent = cfg.appName || "LALIT MODS";
    document.getElementById("brandName").textContent = cfg.brandName || "LalitMods";
    document.getElementById("brandTag").textContent = cfg.brandTag || "LALIT CREATIVE";
    document.title = cfg.brandName || "LalitMods";

    APPS = (cfg.apps || []).map(a => ({
      name: a.name,
      cat: a.category || "",
      size: Number(a.sizeMB) || 0,
      rating: Number(a.rating) || 0,
      letter: (a.letter || a.name.charAt(0)).toUpperCase(),
      url: a.downloadUrl || cfg.telegramUrl || "#",
      version: a.version || "1.0",
      updated: a.updated || "-",
      description: a.description || "Is app ki details jaldi add ki jayengi.",
      screenshots: Array.isArray(a.screenshots) ? a.screenshots.slice(0, 3) : []
    }));
    render(APPS);
  }

  function shotsHtml(list, extraClass) {
    if (!list.length) return "";
    return `<div class="shots ${extraClass || ""}">` +
      list.map(src => `<img src="${src}" alt="screenshot" loading="lazy" onerror="this.style.display='none'">`).join("") +
      `</div>`;
  }

  function render(items) {
    listEl.innerHTML = items.map(a => `
      <div class="card" data-index="${APPS.indexOf(a)}">
        <div class="icon">${a.letter}</div>
        <div class="info">
          <div class="name">${a.name}</div>
          <div class="cat">${a.cat}</div>
          <div class="meta">
            <span class="pill">📦 ${a.size.toFixed(1)} MB</span>
            <span class="pill rating">⭐ ${a.rating.toFixed(1)}</span>
          </div>
          ${shotsHtml(a.screenshots)}
        </div>
      </div>`).join("");
    emptyEl.style.display = items.length ? "none" : "block";
  }

  function openDetail(a) {
    sheet.innerHTML = `
      <div class="sheet-head">
        <div class="icon">${a.letter}</div>
        <div>
          <div class="sheet-title">${a.name}</div>
          <div class="sheet-cat">${a.cat}</div>
        </div>
        <button class="close" id="closeBtn" aria-label="Close">✕</button>
      </div>

      <div class="stats">
        <div class="stat"><b>${a.size.toFixed(1)} MB</b><span>Size</span></div>
        <div class="stat"><b>⭐ ${a.rating.toFixed(1)}</b><span>Rating</span></div>
        <div class="stat"><b>v${a.version}</b><span>Version</span></div>
      </div>

      ${a.screenshots.length ? `<div class="sec-title">Screenshots</div>${shotsHtml(a.screenshots, "sec-shots")}` : ""}

      <div class="sec-title">Update date</div>
      <div class="sec-text">${a.updated}</div>

      <div class="sec-title">Description</div>
      <div class="sec-text">${a.description}</div>

      <a class="dl" href="${a.url}" target="_blank" rel="noopener">⬇ Download</a>
    `;
    overlay.classList.add("open");
    document.getElementById("closeBtn").addEventListener("click", closeDetail);
  }

  function closeDetail() {
    overlay.classList.remove("open");
  }

  listEl.addEventListener("click", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    openDetail(APPS[Number(card.dataset.index)]);
  });

  overlay.addEventListener("click", e => {
    if (e.target === overlay) closeDetail();
  });

  function showMain() {
    document.getElementById("splash").classList.add("hide");
    document.getElementById("main").classList.add("show");
  }
  document.getElementById("splash").addEventListener("click", showMain);
  setTimeout(showMain, 3500);
  setTimeout(showMain, 6000);
  loadConfig();

  document.getElementById("searchInput").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    render(APPS.filter(a => a.name.toLowerCase().includes(q) || a.cat.toLowerCase().includes(q)));
  });

  document.getElementById("themeBtn").addEventListener("click", () => {
    themeIndex = (themeIndex + 1) % THEMES.length;
    document.documentElement.setAttribute("data-theme", THEMES[themeIndex]);
    document.querySelector('meta[name="theme-color"]').content =
      getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  });
</script>
</body>
</html>
